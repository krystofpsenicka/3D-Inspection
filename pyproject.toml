[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-inspection"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<2.3",
    "scipy>=1.10",
    "trimesh",
    "open3d",
    "matplotlib",
    "Pillow",
    "pyyaml",
    "pulp",
    "highspy",
    "evotorch",
    # OptiX raycasting — requires OptiX SDK >= 7.7 (see README) and torch
    # not on PyPI: pip install git+https://github.com/lcp29/trimesh-ray-optix.git
    "triro",
    # OMPL Python bindings (2.0+); used by VRP/mapf/path_smoother.py
    "ompl>=2.0",
]

[project.optional-dependencies]
rapids = [
    "cupy-cuda12x",
    # Pinned to 26.2.* — RAPIDS 26.4 pulls numba 0.64, which conflicts with
    # isaacsim-core's numba==0.59.1 pin (and breaks under coverage 7.4.x).
    "cudf-cu12==26.2.*",
    "cugraph-cu12==26.2.*",
    "cuopt-cu12==26.2.*",
]
isaac = [
    # PyTorch — install with:
    #   pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
    "torch>=2.1",
    "torchvision",
    "torchaudio",
    # IsaacSim + IsaacLab — install with:
    #   pip install "isaacsim[all]==5.0.0.0" isaaclab==2.2.0 --extra-index-url https://pypi.nvidia.com
    "isaacsim==5.0.0.0",
    "isaaclab==2.2.0",
]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["VRP*", "visibility*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["assets", "configs", "data", "models", "plots", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg (common for cp constants)
    "B904",  # raise from in except (low value here)
    "SIM108", # if/else into ternary (often less readable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F841"]
"experiments/*" = ["F401", "E402"]
"scripts/*" = ["E402"]
"VRP/scripts/*" = ["E402"]
"VRP/utils/occupancy_grid.py" = ["E402"]
"visibility/scripts/*" = ["E402"]
"run_full_pipeline.py" = ["E402"]
"run_isaaclab_full_pipeline.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
