# Navigation-specific robot config for multi-AUV waypoint planning.
# Uses base_link as EE (not camera) and only the 6 navigation DOFs.
# Camera joints are excluded from c-space so the planner can always
# find a solution for any reachable position + orientation.
robot_cfg:
  kinematics:
    external_asset_path: null  # Set at runtime
    urdf_path: "robot/brov/brov.urdf"
    usd_path: "robot/brov/brov.usd"
    asset_root_path: "robot/brov"
    base_link: "world"
    ee_link: "base_link"
    collision_link_names:
      [
        "base_link",
        "camera_mount_link",
        "camera_yaw_link",
        "camera_link",
      ]
    collision_spheres: "spheres/brov.yml"
    collision_sphere_buffer: 0.005
    use_global_cumul: True
    self_collision_ignore:
      {
        "base_link": ["camera_mount_link", "camera_yaw_link", "camera_link"],
        "camera_mount_link": ["base_link", "camera_yaw_link", "camera_link"],
        "camera_yaw_link": ["base_link", "camera_mount_link", "camera_link"],
        "camera_link": ["base_link", "camera_mount_link", "camera_yaw_link"],
      }
    self_collision_buffer:
      {
        "base_link": 0.0,
        "camera_mount_link": 0.0,
        "camera_yaw_link": 0.0,
        "camera_link": 0.0,
      }
    lock_joints:
      camera_yaw_joint: 0.0
      camera_pitch_joint: 0.0
    cspace:
      joint_names:
        - "x_joint"
        - "y_joint"
        - "z_joint"
        - "yaw_joint"
        - "pitch_joint"
        - "roll_joint"
      retract_config: [0.0, 0.0, 0.5, 0.0, 0.0, 0.0]
      null_space_weight: [0.5, 0.5, 0.5, 1.0, 1.0, 1.0]
      cspace_distance_weight: [1.0, 1.0, 1.0, 5.0, 5.0, 5.0]
      max_acceleration: 15.0
      max_jerk: 500.0
